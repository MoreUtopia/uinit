[package]
name = "uinit"
version = "1.0.0"
edition = "2024"

[dependencies]
rustix = { version = "1.1.6", features = ["all-apis"] }
serde = { version = "1.0.229", features = ["derive"] }
mlua = { version = "0.12.3", features = ["lua55", "vendored"] }
toml = "1.2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
